# Nginx configuration for AI Writer SaaS
# This config handles SPA routing, API Proxying, WebSockets, and SSE.

server {
    listen 8080;
    server_name localhost;

    # Root directory for the React build (Vite 'dist' folder)
    root /usr/share/nginx/html;
    index index.html;

    # Support for React Router (SPA)
    # Prevents 404 on page refresh by redirecting non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://accounts.google.com/gsi/client https://static.cloudflareinsights.com 'sha256-ZPgxjCPgff6am7DWslx6WB0PIzYQDfotzb/BuAaaD50=' 'sha256-ieoeWczDHkReVBsRBqaal5AFMlBtNjMzgwKvLqi/tSU=' 'sha256-8MEfWdTiqk3ricxHMlnX2Ozh0HJQkGIxVl+pBKnHt2w='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https://api.stripe.com https://accounts.google.com/gsi/ https://cloudflareinsights.com; frame-src https://js.stripe.com https://accounts.google.com/gsi/; frame-ancestors 'self'" always;

    # Hide Nginx version
    server_tokens off;

    # Max upload size (important for large documents or assets)
    client_max_body_size 10M;

    # Gzip compression for better frontend performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
